<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Upotto Foreman{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
  <aside class="nav">
    <div class="brand">Upotto Foreman</div>
    <a class="{{ 'active' if active == 'dashboard' }}" href="{{ url_for('legacy_dashboard') }}">Dashboard</a>
    <a class="{{ 'active' if active == 'project' }}" href="{{ url_for('project_page') }}">Project</a>
    <a class="{{ 'active' if active == 'approvals' }}" href="{{ url_for('approvals_page') }}">Approvals</a>
    <a class="{{ 'active' if active == 'logs' }}" href="{{ url_for('logs_page') }}">Logs</a>
    <a class="{{ 'active' if active == 'chat' }}" href="{{ url_for('chat_page') }}">Chat</a>
    <a class="{{ 'active' if active == 'settings' }}" href="{{ url_for('settings_page') }}">Settings</a>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
